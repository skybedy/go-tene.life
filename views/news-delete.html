{{ template "header.html" . }}
{{ template "nav.html" . }}
<main class="news-container"><section class="surface-panel p-6 sm:p-8 max-w-2xl mx-auto">
    <h1 class="text-2xl font-semibold mb-4">Smazat článek?</h1>
    <p class="break-words mb-4">„{{ .Article.Title }}“ bude trvale odstraněn. Pro dočasné skrytí jej místo toho uložte jako koncept.</p>
    <form method="post" action="{{ .FormAction }}" class="space-y-5">
        <input type="hidden" name="csrf" value="{{ .CSRF }}"><input type="hidden" name="revision" value="{{ .Article.Revision }}">
        <label class="flex gap-3 items-start"><input type="checkbox" name="confirm" value="yes" required class="mt-1">Potvrzuji trvalé smazání tohoto článku.</label>
        <div class="flex flex-wrap gap-4"><button type="submit" class="news-button bg-red-700 hover:bg-red-800">Trvale smazat</button><a class="news-button-secondary" href="/admin/zpravy/{{ .Article.ID }}">Zrušit</a></div>
    </form>
</section></main>
{{ template "footer.html" . }}
